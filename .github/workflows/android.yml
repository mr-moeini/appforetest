name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.mrmoeini.qatest'" badging.txt
          grep -q "application-label:'test'" badging.txt
          grep -q "application-icon" badging.txt
          echo "APK metadata OK"
          mv "$APK" test-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: test-debug-apk
          path: test-debug.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install test-debug.apk
            bash scripts/smoke_test.sh

      - name: Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ui-dump
          path: ui.xml
          if-no-files-found: ignore
